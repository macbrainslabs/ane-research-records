name: Verify release data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate tabular invariants and evidence metadata
        run: node scripts/verify.mjs
      - name: Confirm archive audit rejects mutated and malformed data
        run: node --test tests/publication-audit.test.mjs
      - name: Verify GitHub, Zenodo and DataCite published bytes
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/audit-publication.mjs
